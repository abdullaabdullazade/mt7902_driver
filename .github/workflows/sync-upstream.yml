name: Sync upstream

# Keeps the bundled copies of the two upstreams that are still alive in step:
#   mt76/        <- morrownr/mt76            (WiFi, mainline mt76 at 7.3 level)
#   mt7902_temp/ <- OnlineLearningTutorials/mt7902_temp (Bluetooth trees)
# hmtheboy154/mt7902 (mt7902/) is archived and carries local fixes, and
# gen4-mt7902/ is a vendor tree with local fixes too, so neither is synced:
# overwriting them would throw those fixes away.
#
# One branch, "upstream-sync", is force-updated and one pull request kept
# open; nothing is opened when nothing changed. The synced commit ids live in
# .upstream-sync/ on main once the PR is merged.

on:
  schedule:
    - cron: '0 6 * * 1'   # weekly, Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync
        id: sync
        run: |
          set -euo pipefail
          mkdir -p .upstream-sync
          changed=""

          mt76_sha=$(git ls-remote https://github.com/morrownr/mt76.git HEAD | cut -f1)
          if [ "$mt76_sha" != "$(cat mt76/.upstream-sha 2>/dev/null)" ]; then
            git clone -q https://github.com/morrownr/mt76.git /tmp/mt76
            fw=$(mktemp -d)
            cp mt76/firmware/* "$fw/"
            rsync -a --delete --exclude=.git --exclude=.github --exclude='firmware/' /tmp/mt76/ mt76/
            mkdir -p mt76/firmware
            for f in WIFI_MT7902_patch_mcu_1_1_hdr.bin WIFI_RAM_CODE_MT7902_1.bin BT_RAM_CODE_MT7902_1_1_hdr.bin LICENSE.mediatek; do
              cp "/tmp/mt76/firmware/$f" mt76/firmware/ 2>/dev/null || cp "$fw/$f" mt76/firmware/
            done
            echo "$mt76_sha" > mt76/.upstream-sha
            changed="$changed mt76@${mt76_sha:0:7}"
          fi

          bt_sha=$(git ls-remote https://github.com/OnlineLearningTutorials/mt7902_temp.git HEAD | cut -f1)
          if [ "$bt_sha" != "$(cat .upstream-sync/mt7902_temp.sha 2>/dev/null)" ]; then
            git clone -q https://github.com/OnlineLearningTutorials/mt7902_temp.git /tmp/bt
            for d in /tmp/bt/linux-*; do
              rsync -a --delete "$d/" "mt7902_temp/$(basename "$d")/"
            done
            cp /tmp/bt/README.md mt7902_temp/README.md
            echo "$bt_sha" > .upstream-sync/mt7902_temp.sha
            changed="$changed mt7902_temp@${bt_sha:0:7}"
          fi

          echo "changed=${changed# }" >> "$GITHUB_OUTPUT"

      - name: Open or update the pull request
        if: steps.sync.outputs.changed != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGED: ${{ steps.sync.outputs.changed }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B upstream-sync
          git add -A
          git diff --cached --quiet && exit 0
          git commit -q -m "chore: sync upstream ($CHANGED)"
          git push -f origin upstream-sync
          body="Automatic sync: $CHANGED. The build workflow on this PR compiles every driver against several Ubuntu kernels; merge only when it is green."
          if gh pr view upstream-sync --json state -q .state 2>/dev/null | grep -q OPEN; then
            gh pr edit upstream-sync --title "chore: sync upstream ($CHANGED)" --body "$body"
          else
            gh pr create --base main --head upstream-sync --title "chore: sync upstream ($CHANGED)" --body "$body"
          fi
