# DKMS package for the MT7902 Bluetooth backport (patched btusb + btmtk).
#
# The modules go to /updates/dkms, which depmod searches before the kernel's
# own tree, so the distribution's btusb/btmtk are never overwritten: removing
# this package (or booting a kernel it does not build for) brings them back.
# DKMS rebuilds it for every new kernel, so Bluetooth survives kernel updates.
#
# Kernel 7.1 and newer carry MT7902 Bluetooth support themselves, so the
# package deliberately refuses to build there and the stock modules are used.
PACKAGE_NAME="mt7902-bt"
PACKAGE_VERSION="1.0"
BUILD_EXCLUSIVE_KERNEL="^(6\.([6-9]|1[0-9])|7\.0)\."
MAKE[0]="make KVER=${kernelver}"
CLEAN="make clean"
BUILT_MODULE_NAME[0]="btusb"
BUILT_MODULE_NAME[1]="btmtk"
DEST_MODULE_LOCATION[0]="/updates/dkms"
DEST_MODULE_LOCATION[1]="/updates/dkms"
AUTOINSTALL="yes"
